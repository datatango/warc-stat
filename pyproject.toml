[project]
name = "warcstat"
version = "0.1.0"
description = "Summary stats for WARC files, as JSON"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "warcio>=1.7.5",
]

[project.scripts]
warcstat = "warcstat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
